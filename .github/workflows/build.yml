name: build-m0

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE', 'device/**/*.md']
  workflow_dispatch:

concurrency:
  group: build-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af > /dev/null || true
          df -h /

      - name: Restore host tools (pahole, bindgen)
        uses: actions/cache@v4
        with:
          path: ~/host-tools
          key: host-tools-pahole1.30-bindgen0.72.1-noble

      - name: Host packages
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev libdw-dev zlib1g-dev cmake cpio lz4 zstd \
            ccache kmod python3 clang-22 lld-22 llvm-22
          /usr/lib/llvm-22/bin/clang --version | head -1
          T=$HOME/host-tools
          if [ ! -x "$T/bin/pahole" ]; then
            git clone -q --depth 1 --branch v1.30 --recurse-submodules --shallow-submodules \
              https://github.com/acmel/dwarves /tmp/dwarves
            cmake -S /tmp/dwarves -B /tmp/dwarves/build -DCMAKE_BUILD_TYPE=Release -D__LIB=lib \
              -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$T" > /dev/null
            make -C /tmp/dwarves/build -j"$(nproc)" > /dev/null
            make -C /tmp/dwarves/build install > /dev/null
          fi
          echo "$T/bin" >> "$GITHUB_PATH"
          export PATH=$T/bin:$PATH
          pahole --version
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.91.1 --profile minimal --component rust-src --component rustfmt > /dev/null
          rustup default 1.91.1
          [ -x "$T/bin/bindgen" ] || cargo install -q bindgen-cli --version 0.72.1 --locked --root "$T"
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
          rustc --version; bindgen --version

      - name: Sources
        run: bash scripts/fetch.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build GKI 6.18
        run: bash scripts/build_gki.sh

      - name: Boot image (diagnostic, PJA110)
        run: bash scripts/build_bootimg.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}

      - name: Collect
        if: always()
        run: |
          ccache -s || true
          mkdir -p dist
          cp out/gki/arch/arm64/boot/Image dist/ 2>/dev/null || true
          cp out/Image-dtb dist/ 2>/dev/null || true
          cp device/xigua/fdt.dtb dist/ 2>/dev/null || true
          cp out/gki/.config dist/gki.config 2>/dev/null || true
          cp out/gki/include/config/kernel.release dist/ 2>/dev/null || true
          cp out/diag-nolayer.img dist/ 2>/dev/null || true
          cp out/avb.txt dist/ 2>/dev/null || true
          cp out/build.log dist/ 2>/dev/null || true
          cp out/gki-config.log dist/ 2>/dev/null || true
          df -h /
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pja110-k618-m0-${{ github.run_number }}
          path: dist/
          retention-days: 14
