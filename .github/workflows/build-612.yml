name: build-612

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af > /dev/null || true
          df -h /

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev zlib1g-dev cpio lz4 zstd \
            ccache kmod python3 clang-18 lld-18 llvm-18
          clang-18 --version | head -1
          ld.lld-18 --version | head -1

      - name: Fetch ACK 6.12 and mkbootimg
        run: bash scripts/fetch-612.sh

      - name: Build 6.12 Image and diagnostic boot image
        run: bash scripts/build-612.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          cp out/gki/arch/arm64/boot/Image dist/ 2>/dev/null || true
          cp out/boot-612.img dist/ 2>/dev/null || true
          cp out/gki/.config dist/gki.config 2>/dev/null || true
          cp out/gki/include/config/kernel.release dist/kernel.release 2>/dev/null || true
          cp out/build.log dist/build.log 2>/dev/null || true
          cp out/gki-config.log dist/gki-config.log 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pja110-k612-m0-${{ github.run_number }}
          path: dist/
          retention-days: 14